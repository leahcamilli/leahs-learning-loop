name: Test Leah's Learning Loop

on:
  push:
    branches: [master]
    paths:
      - 'ingest/**'
      - 'tests/**'
      - 'build_site.py'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'ingest/**'
      - 'tests/**'
      - 'build_site.py'
      - 'requirements.txt'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ingest/requirements.txt
      - run: python -m pip install -r requirements.txt -r ingest/requirements.txt
      - run: python -m unittest discover -s tests -v

