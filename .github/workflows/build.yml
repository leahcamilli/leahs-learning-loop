name: Build Leah's Learning Loop Site

on:
  push:
    branches: [master]
    paths:
      - 'wiki/pages/**'
      - 'build_site.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leahs-learning-loop-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          python build_site.py
          git add index.html
          git diff --cached --quiet && echo "Nothing to rebuild." || \
            git commit -m "build: $(date -u '+%Y-%m-%d %H:%M UTC')" && \
            git push
